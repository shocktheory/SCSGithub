name: Generate composer.lock

# One-purpose helper (Product-Owner-authorized): generate and commit
# server/composer.lock so DigitalOcean's `composer install` can build the PHP
# backend. Lockfile enablement only — pins the dependencies already declared in
# server/composer.json; no new dependency, no behavior change.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-composer-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring
          tools: composer
      - name: Generate composer.lock
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Validate composer.json / composer.lock consistency
        run: composer validate --no-check-publish
      - name: Verify install-from-lock (mimics DigitalOcean composer install)
        run: |
          rm -rf vendor
          composer install --no-interaction --no-progress
      - name: Commit composer.lock
        run: |
          if [ -n "$(git status --porcelain composer.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "Add server/composer.lock to enable DigitalOcean PHP build (Product-Owner-authorized; pins declared deps, no behavior change)"
            git push
          else
            echo "composer.lock unchanged; nothing to commit"
          fi
